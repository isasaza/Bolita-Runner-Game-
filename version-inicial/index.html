<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Junimo Runner</title>
    <link rel="icon" type = "image/png" href="./favicon.png">
    <link rel="stylesheet" href="./src/css/style.css">


    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="hud">
        <div class="hud-item">
            VIDAS <span id="hud-vidas">3</span>
        </div>

        <div class="hud-item">
            PUNTOS <span id="hud-puntos">0</span>
        </div>

        <div class="hud-item">
            TIEMPO <span id="hud-tiempo">300</span>
        </div>
    </div>

    <div id="aviso" class="oculto"></div>

    <div id="pantalla-inicio" class="pantalla">
        <h1>
            Computer Graphics
            <span class="acento">Runner Game</span>
        </h1>

        <p class="pista">
            Controla el Junimo y supera los obstáculos.<br>
            Salta sobre los enemigos para eliminarlos.<br>
            Evita caer al vacío.<br>
            Alcanza la bandera para completar el nivel.
        </p>

        <button id="btn-jugar">JUGAR</button>
    </div>

    <div id="pantalla-pausa" class="pantalla oculto">
        <h1>PAUSA</h1>
        <p class="subtitulo">
            Presiona P para continuar
        </p>
    </div>

    <div id="pantalla-fin" class="pantalla oculto">
        <h1 id="fin-titulo">FIN DEL JUEGO</h1>
        <p id="fin-detalle" class="subtitulo"></p>
        <button id="btn-reiniciar">
            JUGAR DE NUEVO
        </button>
    </div>

    <script type="module" src="./src/js/game.js"></script>

</body>
</html>
